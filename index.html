<style>
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: one narrow column, a "ticket" for this week's pick, then the 32-team board and a weekly log. */
:root {
  --bg: #eef1ee;
  --surface: #ffffff;
  --fg: #16201a;
  --muted: #5d6a62;
  --line: #d5ddd7;
  --accent: #1f6b45;
  --accent-soft: #dcefe3;
  --used: #aeb8b1;
  --used-fg: #46524b;
  --heat-s: 68%;
  --heat-l: 74%;
  --heat-fg: #16201a;
  --warn: #9a5b00;
  --warn-soft: #fbecd2;
  --bad: #a33224;
  --bad-soft: #f7dcd7;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #1a211d; --fg: #e6ece8; --muted: #9aa8a0; --line: #2c3631;
  --accent: #5cc58c; --accent-soft: #1d3a2a; --used: #2b332f; --used-fg: #7d8a83; --heat-s: 45%; --heat-l: 34%; --heat-fg: #f1f5f2;
  --warn: #f0b456; --warn-soft: #3a2c14; --bad: #f08a7c; --bad-soft: #3d1f1a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #1a211d; --fg: #e6ece8; --muted: #9aa8a0; --line: #2c3631;
  --accent: #5cc58c; --accent-soft: #1d3a2a; --used: #2b332f; --used-fg: #7d8a83; --heat-s: 45%; --heat-l: 34%; --heat-fg: #f1f5f2;
  --warn: #f0b456; --warn-soft: #3a2c14; --bad: #f08a7c; --bad-soft: #3d1f1a; color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 22px; }
h1, h2, .big { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: .01em; line-height: 1; }
h2 { font-size: 1.35rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.label { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.muted { color: var(--muted); }
section { display: grid; gap: 10px; }

.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.alive { display: flex; gap: 6px; align-items: center; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--used); }
.dot.on { background: var(--accent); }

.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ticket-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px dashed var(--line); }
.ticket-body { padding: 16px; display: grid; gap: 14px; }
.pickline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.big { font-size: 2.6rem; font-weight: 800; line-height: .95; }
.prob { font-family: var(--display); font-size: 2rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; text-transform: uppercase; letter-spacing: .06em; }
.pill.pending { background: var(--warn-soft); color: var(--warn); }
.pill.win { background: var(--accent-soft); color: var(--accent); }
.pill.loss { background: var(--bad-soft); color: var(--bad); }

.factors { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.factors li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; }
.mark { font-weight: 700; text-align: center; border-radius: 5px; font-size: .85rem; line-height: 22px; }
.mark.plus { background: var(--accent-soft); color: var(--accent); }
.mark.minus { background: var(--warn-soft); color: var(--warn); }
.mark.info { background: var(--bg); color: var(--muted); }

.options { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.options td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.options tr:last-child td { border-bottom: 0; }
.options .t { font-weight: 700; white-space: nowrap; }
.options .p { text-align: right; font-weight: 700; white-space: nowrap; }
.options .n { color: var(--muted); font-size: .9rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }

.opts { display: grid; gap: 8px; }
.opt { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; border-left: 6px solid hsl(var(--h) var(--heat-s) calc(var(--heat-l) - 14%)); }
.opt summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto 18px; gap: 10px; align-items: center; padding: 12px 14px; }
.opt summary::-webkit-details-marker { display: none; }
.opt summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.opt .nm { font-family: var(--display); font-weight: 800; font-size: 1.45rem; line-height: 1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt .sub { font-size: .82rem; color: var(--muted); margin-top: 3px; }
.opt .pc { font-family: var(--display); font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; padding: 2px 8px; border-radius: 6px; background: hsl(var(--h) var(--heat-s) var(--heat-l)); color: var(--heat-fg); }
.opt .chev { color: var(--muted); transition: transform .15s; text-align: center; }
.opt[open] .chev { transform: rotate(90deg); }
.opt .inner { padding: 0 14px 14px; border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 10px; }
.tag { font-family: var(--body); font-size: .65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tier { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-top: 8px; }
@media (prefers-reduced-motion: reduce) { .opt .chev { transition: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .85rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.conf { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.div { display: grid; gap: 4px; }
.div .label { font-size: .65rem; }
.teams { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tm { font-family: var(--display); font-weight: 700; font-size: 1rem; text-align: center; padding: 5px 0 4px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); display: grid; line-height: 1.1; }
.tm small { font-family: var(--body); font-size: .68rem; font-weight: 600; font-variant-numeric: tabular-nums; opacity: .85; }
.tm.heat { background: hsl(var(--h) var(--heat-s) var(--heat-l)); border-color: transparent; color: var(--heat-fg); }
.tm.used { background: var(--used); border-color: var(--used); color: var(--used-fg); text-decoration: line-through; }
.tm.lean { outline: 2px solid var(--fg); outline-offset: 1px; }
.tm.bye { border-style: dashed; color: var(--muted); }
.scale { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); }
.scale .bar { flex: 1; max-width: 220px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, hsl(0 var(--heat-s) var(--heat-l)), hsl(50 var(--heat-s) var(--heat-l)), hsl(130 var(--heat-s) var(--heat-l))); }

.log { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.log li { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.log li:last-child { border-bottom: 0; }
.wk { font-family: var(--display); font-weight: 700; color: var(--muted); text-transform: uppercase; }
.updated { font-size: .85rem; color: var(--muted); }

.trk { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tbtn { font: 700 1rem var(--display); padding: 9px 0; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; display: grid; line-height: 1.1; }
.tbtn small { font: 600 .65rem var(--body); color: var(--muted); }
.tbtn[aria-pressed="true"] { background: var(--used); border-color: var(--used); color: var(--used-fg); }
.tbtn[aria-pressed="true"] small { color: var(--used-fg); }
.tbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn { font: 600 .85rem var(--body); padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.empty { padding: 12px 0; color: var(--muted); }
@media (max-width: 420px) { .conf { grid-template-columns: 1fr; } .big { font-size: 2.2rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="label">NFL 2026 · Survivor picks</div>
      <h1>Gut Feeling</h1>
    </div>
  </header>

  <section>
    <h2 id="wk-title"></h2>

    <div class="conf" id="tracker"></div>

    <div class="row">
      <span class="updated" id="clear-msg"></span>
      <span>
        <button class="btn" id="clear-no" hidden>Keep them</button>
        <button class="btn danger" id="clear">Clear all used teams</button>

  </section>

  <div class="updated" id="updated"></div>
</div>

// 30% or less = red, 50% = yellow, 80%+ = green
function heatHue(p) {
  const x = Math.max(30, Math.min(80, p));
  return x <= 50 ? (x - 30) / 20 * 50 : 50 + (x - 50) / 30 * 80;
}

const KEY = "survivor-used-v1";

try { used = JSON.parse(localStorage.getItem(KEY)); } catch (e) { used = null; }
if (!Array.isArray(used)) used = [];
function save() { try { localStorage.setItem(KEY, JSON.stringify(used)); } catch (e) {} }
const isUsed = a => used.some(u => u.a === a);
function nextWeek() { let n = 1; while (used.some(u => u.wk === n)) n++; return n; }
function toggle(a) {
  if (isUsed(a)) used = used.filter(u => u.a !== a);
  else used.push({ a, wk: nextWeek() });
  save(); render();
}

function factorList(t) {
  const ul = el("ul", "factors");
  t.f.forEach(([k, txt]) => { const li = el("li"); li.append(el("span", "mark " + k, signs[k]), el("span", null, txt)); ul.append(li); });
  if (t.v) { const li = el("li"); li.append(el("span", "mark info", "i"), el("span", null, "Venue: " + t.v + (t.v === "Outdoor" ? ". Forecast gets checked closer to kickoff." : ", so weather is not a factor."))); ul.append(li); }
  return ul;
}

function render() {
  const openIds = new Set([...document.querySelectorAll(".opt[open]")].map(d => d.id));
  const firstRender = !document.querySelector(".opt");
  const avail = w.teams.filter(t => !isUsed(t.a)).sort((x, y) => w.probs[y.a] - w.probs[x.a]);
  const top = avail[0], second = avail[1];


  // Suggested pick
  $("wk-title").textContent = `Week ${w.week} pick`;
  $("wk-factors").replaceChildren();
  if (top) {
    $("wk-game").textContent = top.g;
    $("wk-pick").textContent = top.n;
    $("wk-prob").textContent = w.probs[top.a] + "%";
    $("wk-factors").append(...factorList(top).children);
    $("wk-backup").textContent = second ? `Backup if news breaks: ${second.n} (${w.probs[second.a]}%).` : "";
  } else {
    $("wk-game").textContent = ""; $("wk-pick").textContent = "No teams left"; $("wk-prob").textContent = ""; $("wk-backup").textContent = "";
  }

  // Every option
  $("opts").replaceChildren();
  $("opts-note").textContent = `${avail.length} teams you can still pick, best first. Tap one for its report.`;
  const tiers = [[70, "Best bets · 70%+"], [55, "Risky · 55–70%"], [0, "Underdogs · avoid"]];
  let lastTier = null;
  avail.forEach(t => {
    const p = w.probs[t.a];
    const tier = tiers.find(([min]) => p >= min);
    if (tier !== lastTier) { $("opts").append(el("div", "tier", tier[1])); lastTier = tier; }
    const d = el("details", "opt");
    d.id = "opt-" + t.a;
    d.style.setProperty("--h", heatHue(p));
    d.open = firstRender ? p >= 70 : openIds.has(d.id);
    const sm = el("summary");
    const left = el("div");
    const nm = el("div", "nm", t.n);
    if (top && t.a === top.a) nm.append(el("span", "tag", "Suggested"));
    left.append(nm, el("div", "sub", t.g));
    sm.append(left, el("span", "pc", p + "%"), el("span", "chev", "›"));
    const inner = el("div", "inner");
    inner.append(factorList(t));
    d.append(sm, inner);
    $("opts").append(d);
  });

  // Heat map
  $("board").replaceChildren();
  DIVS.forEach(([name, teams]) => {
    const d = el("div", "div"); d.append(el("div", "label", name));
    const g = el("div", "teams");
    teams.forEach(t => {
      let c = "tm";
      const p = w.probs[t];
      const tile = el("div");
      tile.append(document.createTextNode(t));
      if (isUsed(t)) c += " used";
      else if (w.byes.includes(t)) { c += " bye"; tile.append(el("small", null, "bye")); }
      else if (p != null) {
        c += " heat";
        tile.style.setProperty("--h", heatHue(p));
        tile.append(el("small", null, (Math.round(p * 10) / 10) + "%"));
      }
      if (top && t === top.a) c += " lean";
      tile.className = c;
      tile.title = p != null ? `${NAMES[t]}: ${p}% win probability` : NAMES[t];
      g.append(tile);
    });
    d.append(g); $("board").append(d);
  });
  $("leftcount").textContent = `${32 - used.length} teams still available · ${w.byes.map(b => NAMES[b]).join(" and ")} on bye in Week ${w.week}`;

  // Team tracker
  $("tracker").replaceChildren();
  DIVS.forEach(([name, teams]) => {
    const d = el("div", "div"); d.append(el("div", "label", name));
    const g = el("div", "trk");
    teams.forEach(t => {
      const u = used.find(x => x.a === t);
      const b = el("button", "tbtn");
      b.type = "button";
      b.id = "trk-" + t;
      b.setAttribute("aria-pressed", u ? "true" : "false");
      b.setAttribute("aria-label", `${NAMES[t]}${u ? ", used in week " + u.wk : ""}`);
      b.append(document.createTextNode(t), el("small", null, u ? "Wk " + u.wk : "\u00a0"));
      b.addEventListener("click", () => toggle(t));
      g.append(b);
    });
    d.append(g); $("tracker").append(d);
  });
  $("usedcount").textContent = `${used.length} used`;

  $("log").replaceChildren();
  const sorted = used.slice().sort((x, y) => x.wk - y.wk);
  if (!sorted.length) $("log").append(el("li", "empty", "No teams marked yet. Tap the teams you've picked above."));
  sorted.forEach(u => {
    const li = el("li");
    const mid = el("div"); const nm = el("div", null, NAMES[u.a]); nm.style.fontWeight = "700";
    mid.append(nm, el("div", "muted", u.a));
    li.append(el("span", "wk", "Wk " + u.wk), mid, el("span", "pill win", "Used"));
    $("log").append(li);
  });
  if (top) {
    const li = el("li");
    const mid = el("div"); const nm = el("div", null, top.n + " (suggested)"); nm.style.fontWeight = "700";
    mid.append(nm, el("div", "muted", top.g));
    li.append(el("span", "wk", "Wk " + w.week), mid, el("span", "pill pending", "Not picked"));
    $("log").append(li);
  }
  $("updated").textContent = "Odds and reports last updated " + DATA.updated;
}

// Clear all, with an on-page confirm
let confirming = false;
$("clear").addEventListener("click", () => {
  if (!confirming) {
    confirming = true;
    $("clear").textContent = "Yes, clear all";
    $("clear-no").hidden = false;
    $("clear-msg").textContent = "Remove every used team?";
    return;
  }
  used = []; save(); resetClear(); render();
});
$("clear-no").addEventListener("click", resetClear);
function resetClear() {
  confirming = false;
  $("clear").textContent = "Clear all used teams";
  $("clear-no").hidden = true;
  $("clear-msg").textContent = "";
}

render();

// Install support: works offline and picks up new versions on the next open
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
</body>
</html>
